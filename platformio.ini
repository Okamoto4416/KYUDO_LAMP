; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs=platformio_local.ini

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
lib_compat_mode = strict
build_src_filter =
	-<**/main*.cpp> ;ここで **/main*.cpp をビルド対象から除外する
	-<**/test*.cpp>

; 環境1（esp32dev1）
[env:main_remote]
build_src_filter =
	${env.build_src_filter}
	+<remote/main_remote.cpp> ;ここで main1.cpp をビルド対象とする
; lib_deps = 
; 	${env.lib_deps}
; 	hideakitai/ArduinoOSC@^0.5.1 ;ここに環境固有のライブラリを記述する

; 環境2（esp32dev2）
[env:main_lamp]
build_src_filter =
	${env.build_src_filter}
	+<lamp/main_lamp.cpp> ;ここで main2.cpp をビルド対象とする
